<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen p-6">

  <!-- Header -->
  <header class="flex justify-between items-center mb-6 max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold">Personal Analytics & Hub</h1>
    <button onclick="toggleDarkMode()" class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded-md">
      🌙 Toggle Dark Mode
    </button>
  </header>

  <!-- Main Dashboard Grid -->
  <main class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <!-- ORIGINAL WIDGET 1: Tasks / To-Do List -->
    <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-3">✅ Daily Tasks</h2>
      <div class="flex gap-2 mb-3">
        <input id="taskInput" type="text" placeholder="Add new task..." class="flex-1 p-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 text-sm">
        <button onclick="addTask()" class="bg-blue-600 text-white px-3 py-1 rounded-md text-sm">Add</button>
      </div>
      <ul id="taskList" class="space-y-2 text-sm"></ul>
    </div>

    <!-- NEW WIDGET 1: Habit Tracker Card -->
    <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-3">🔥 Habit Tracker</h2>
      <div class="flex gap-2 mb-3">
        <input id="habitInput" type="text" placeholder="New habit (e.g. Read 20 mins)..." class="flex-1 p-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 text-sm">
        <button onclick="addHabit()" class="bg-green-600 text-white px-3 py-1 rounded-md text-sm">Track</button>
      </div>
      <div id="habitContainer" class="space-y-3 text-sm"></div>
    </div>

    <!-- NEW WIDGET 2: Quick Budget Calculator -->
    <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-3">💰 Quick Budget Calculator</h2>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <input id="budgetIncome" type="number" placeholder="Monthly Income ($)" class="p-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 text-sm" oninput="calculateBudget()">
        <input id="budgetExpenses" type="number" placeholder="Monthly Expenses ($)" class="p-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 text-sm" oninput="calculateBudget()">
      </div>
      <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg space-y-1 text-sm">
        <div class="flex justify-between"><span>Net Savings:</span><span id="netSavings" class="font-bold text-green-500">$0</span></div>
        <div class="flex justify-between"><span>Savings Rate:</span><span id="savingsRate" class="font-bold text-blue-500">0%</span></div>
      </div>
    </div>

    <!-- ORIGINAL WIDGET 2: Notes / Quick Capture -->
    <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow md:col-span-2 lg:col-span-3">
      <h2 class="text-lg font-semibold mb-3">📝 Quick Notes</h2>
      <textarea id="notesArea" placeholder="Write thoughts or notes here..." class="w-full h-24 p-3 border rounded-md dark:bg-gray-700 dark:border-gray-600 text-sm" oninput="saveNotes()"></textarea>
    </div>

  </main>

  <!-- Dashboard JavaScript Logic with LocalStorage -->
  <script>
    // Dark Mode Toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // Tasks Management
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = tasks.map((t, i) => `
        <li class="flex justify-between items-center bg-gray-50 dark:bg-gray-700 p-2 rounded">
          <span class="${t.done ? 'line-through text-gray-400' : ''}" onclick="toggleTask(${i})">${t.text}</span>
          <button onclick="removeTask(${i})" class="text-red-500 text-xs">✕</button>
        </li>
      `).join('');
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
    }
    function addTask() {
      const input = document.getElementById('taskInput');
      if (input.value.trim()) {
        tasks.push({ text: input.value.trim(), done: false });
        input.value = '';
        renderTasks();
      }
    }
    function toggleTask(i) { tasks[i].done = !tasks[i].done; renderTasks(); }
    function removeTask(i) { tasks.splice(i, 1); renderTasks(); }

    // Habit Tracker Management
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [];
    function renderHabits() {
      const container = document.getElementById('habitContainer');
      container.innerHTML = habits.map((h, i) => `
        <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-700 p-2 rounded">
          <span>${h.name}</span>
          <div class="flex items-center gap-2">
            <button onclick="checkHabit(${i})" class="bg-emerald-500 text-white text-xs px-2 py-1 rounded">Streak: ${h.streak || 0} 🔥</button>
            <button onclick="removeHabit(${i})" class="text-red-500 text-xs">✕</button>
          </div>
        </div>
      `).join('');
      localStorage.setItem('my_habits', JSON.stringify(habits));
    }
    function addHabit() {
      const input = document.getElementById('habitInput');
      if (input.value.trim()) {
        habits.push({ name: input.value.trim(), streak: 0 });
        input.value = '';
        renderHabits();
      }
    }
    function checkHabit(i) { habits[i].streak = (habits[i].streak || 0) + 1; renderHabits(); }
    function removeHabit(i) { habits.splice(i, 1); renderHabits(); }

    // Budget Calculator Logic
    function calculateBudget() {
      const income = parseFloat(document.getElementById('budgetIncome').value) || 0;
      const expenses = parseFloat(document.getElementById('budgetExpenses').value) || 0;
      const savings = income - expenses;
      const rate = income > 0 ? ((savings / income) * 100).toFixed(1) : 0;

      document.getElementById('netSavings').innerText = `$${savings}`;
      document.getElementById('savingsRate').innerText = `${rate}%`;

      localStorage.setItem('my_budget', JSON.stringify({ income, expenses }));
    }

    // Notes Persistence
    function saveNotes() {
      localStorage.setItem('my_notes', document.getElementById('notesArea').value);
    }

    // Initialize saved data on page load
    window.onload = () => {
      renderTasks();
      renderHabits();
      const savedNotes = localStorage.getItem('my_notes');
      if (savedNotes) document.getElementById('notesArea').value = savedNotes;

      const savedBudget = JSON.parse(localStorage.getItem('my_budget'));
      if (savedBudget) {
        document.getElementById('budgetIncome').value = savedBudget.income || '';
        document.getElementById('budgetExpenses').value = savedBudget.expenses || '';
        calculateBudget();
      }
    };
  </script>
</body>
</html>
